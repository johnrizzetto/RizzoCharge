name: macOS build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test and package
        run: ./build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RizzoCharge-unsigned
          path: |
            dist/RizzoCharge-macOS-unsigned.zip
            dist/SHA256SUMS.txt
